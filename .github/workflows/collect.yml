name: Collect sector flows

on:
  schedule:
    - cron: "30 1 * * 2-6"    # ~9:30 PM ET, after State Street posts the day's data
    - cron: "15 10 * * 1-5"   # ~6:15 AM ET, final refresh before the 7:30 AM brief
  workflow_dispatch:           # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl requests
      - run: python collect_flows.py
      - name: Save results
        run: |
          git config user.name "flows-bot"
          git config user.email "flows-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update sector flows $(date -u +%F)"
          git push
